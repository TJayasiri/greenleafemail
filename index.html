<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>greenleafemail.com</title>
  <style>
    :root {
      --accent: #62bbc1;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    main {
      max-width: 32rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin: 0 0 1.75rem;
      color: #fff;
    }
    a.brand {
      display: inline-block;
      font-size: 1.4rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    a.brand:hover,
    a.brand:focus {
      text-decoration: underline;
    }
    a.brand span.green {
      color: var(--accent);
    }
    a.brand span.rest {
      color: #fff;
    }
    .cta {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 1.75rem;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      transition: opacity 0.15s ease;
    }
    .cta:hover,
    .cta:focus {
      opacity: 0.85;
    }
    .countdown {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #999;
    }
  </style>
</head>
<body>
  <main>
    <p>This domain is used only to send and secure our email.<br />Please visit our main site.</p>
    <a class="brand" href="https://greenleafassurance.com">
      <span class="green">GreenLeaf</span><span class="rest">Assurance.com</span>
    </a>
    <br />
    <a class="cta" href="https://greenleafassurance.com">Click here</a>
    <p class="countdown">Redirecting automatically in <span id="seconds">10</span>s&hellip;</p>
  </main>
  <script>
    var target = "https://greenleafassurance.com";
    var seconds = 10;
    var el = document.getElementById("seconds");
    var timer = setInterval(function () {
      seconds -= 1;
      el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = target;
      }
    }, 1000);
  </script>
</body>
</html>
